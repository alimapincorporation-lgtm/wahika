<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">

<script>try{var t=localStorage.getItem('wahika-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>

<symbol id="i-fork" viewBox="0 0 24 24"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10"/><path d="M17 21V3c-2.5 1.5-3.5 4.5-3.5 8H17"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></symbol>

<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.4 4.4 0 0 1 12 7.2 4.4 4.4 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></symbol>

<div class="boot" id="boot">Loading…</div>

<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <a class="brand" href="../index.html"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-coffee"/></svg></span><span>Wahika<small>Café &amp; Lounge</small></span></a>
    <h1>Admin sign in</h1>
    <p>Sign in to manage the Wahika website.</p>
    <form id="login" autocomplete="on">
      <div class="field"><label for="u">Username</label><input id="u" name="user" type="text" autocomplete="username" required></div>
      <div class="field"><label for="p">Password</label><input id="p" name="pass" type="password" autocomplete="current-password" required></div>
      <div class="err" id="login-err" role="alert"></div>
      <button class="btn btn-primary" type="submit" style="width:100%">Sign in</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <a class="brand" href="../index.html" aria-label="Back to website"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-coffee"/></svg></span><span>Wahika<small>Café &amp; Lounge</small></span></a>
    <div class="right">
      <span class="pill" id="mode"></span>
      <button class="icon-btn theme-toggle" type="button" aria-label="Switch colour theme"><svg class="icon moon" aria-hidden="true"><use href="#i-moon"/></svg><svg class="icon sun" aria-hidden="true"><use href="#i-sun"/></svg></button>
      <button class="btn btn-secondary btn-sm" id="logout" type="button">Sign out</button>
    </div>
  </header>
  <div class="layout">
    <nav id="nav" aria-label="Admin sections"></nav>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/js/content.js"></script>
<script src="../assets/js/registry.js"></script>
<script src="admin.js"></script>
</body>
</html>
